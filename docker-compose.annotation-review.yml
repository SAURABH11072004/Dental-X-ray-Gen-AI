# Clinical review add-on for Label Studio (does not change docker-compose.dentamind.yml).
#   docker compose -f docker-compose.dentamind.yml -f docker-compose.annotation-review.yml --profile annotation up label-studio
# Mounts ./data READ-ONLY so review tasks can show radiographs via /data/local-files/?d=<path relative to data/>,
# and publishes Label Studio on THIS MACHINE ONLY (127.0.0.1), not on the local network.
services:
  label-studio:
    ports: !override
      - "127.0.0.1:8081:8080"
    volumes:
      - ./data:/dentamind-data:ro
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /dentamind-data
